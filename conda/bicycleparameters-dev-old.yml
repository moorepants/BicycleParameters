name: bicycleparameters-dev-old
channels:
  - conda-forge
dependencies:
  # pins are versions in Ubuntu 24.04
  # main
  - dynamicisttoolkit ==0.5.*
  - matplotlib ==3.6.*
  - numpy ==1.26.*
  - pyyaml ==6.0.*
  - scipy ==1.11.*
  - uncertainties ==3.1.*
  - yeadon ==1.3.*
  # app
  - dash >=2
  - dash-bootstrap-components
  - pandas ==2.1.*
  - plotly
  # dev
  - ipython
  - nose
  - numpydoc ==1.6.*
  - pytest
  - sphinx ==7.2.*
  - sphinx-gallery
  - sphinx-reredirects
