name: bicycleparameters-dev
channels:
  - conda-forge
dependencies:
  # pins are versions in Ubuntu 22.04
  # main
  - dynamicisttoolkit >=0.5.3
  - matplotlib >=3.6.3
  - numpy >=1.26.4
  - pyyaml >=6.0.1
  - scipy >=1.11.4
  - uncertainties >=3.1.7
  - yeadon >=1.4.0
  # app
  - dash >=2
  - dash-bootstrap-components
  - pandas >=2.1.4
  - plotly
  # dev
  - ipython
  - nose
  - numpydoc >=1.6.0
  - pytest
  - sphinx >=7.2.6
  - sphinx-gallery
  - sphinx-reredirects
